<section class="section experience" id="experience">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow">&lt;experience/&gt;</span>
      <h2 class="section-title">Where I've worked</h2>
    </div>

    <div class="timeline">
      @for (job of experience; track job.company) {
        <div class="entry">
          <div class="rail">
            <div class="node"></div>
          </div>
          <div class="entry-body card">
            <div class="entry-head">
              <div>
                <h3>{{ job.role }}</h3>
                <p class="company">{{ job.company }} · {{ job.location }}</p>
              </div>
              <span class="period">{{ job.period }}</span>
            </div>
            <ul class="points">
              @for (p of job.points; track p) {
                <li>{{ p }}</li>
              }
            </ul>
            <div class="chips">
              @for (s of job.stack; track s) {
                <span class="tag">{{ s }}</span>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
